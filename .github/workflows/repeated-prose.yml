name: Repeated prose

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repeated-prose:
    name: New within-page repeats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main
      - name: Fail on new within-page repeats and duplicate H2s
        run: node engines/check-repeated-prose.mjs --new-vs origin/main
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Repeated prose"
            echo ""
            echo "Fails when a changed page introduces a within-page sentence of 7 or more words, or a duplicate h2, that origin/main does not already repeat. Cross-page template sentences and repeats inherited from main stay out of this job. Netlify does not run this check."
          } >> "$GITHUB_STEP_SUMMARY"
