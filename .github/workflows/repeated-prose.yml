name: Repeated prose report

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repeated-prose:
    name: Report repeated prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run repeated-prose check
        run: |
          set +e
          node engines/check-repeated-prose.mjs > repeated-prose.txt 2>&1
          cat repeated-prose.txt
          exit 0
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Repeated prose report"
            echo ""
            echo "Informational only. This does not block the Netlify production deploy."
            echo ""
            echo '```'
            head -n 60 repeated-prose.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
