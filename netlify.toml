[build]
  functions = "netlify/functions"

# Enable pretty URLs (clean URLs without .html extension)
[build.processing.html]
  pretty_urls = true

# =====================================================
# REDIRECT RULES — Single-hop 301s to canonical URLs
# Canonical format: https://petcarehelperai.com/path (no trailing slash, no .html)
# Directory indexes use trailing slash: /tools/, /locations/, /feeds/, /guides/, /resources/
# =====================================================

# --- Domain normalization (www → non-www) ---
# Netlify handles http→https automatically at the edge.
# www→non-www is configured via Netlify domain settings.
# These rules provide a fallback for any edge cases.

[[redirects]]
  from = "https://www.petcarehelperai.com/*"
  to = "https://petcarehelperai.com/:splat"
  status = 301
  force = true

# --- Intentional alias redirect ---
[[redirects]]
  from = "/ai"
  to = "/chat"
  status = 301
  force = true

# --- Redirect index.html files to directory paths ---
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/tools/index.html"
  to = "/tools/"
  status = 301
  force = true

[[redirects]]
  from = "/locations/index.html"
  to = "/locations/"
  status = 301
  force = true

[[redirects]]
  from = "/feeds/index.html"
  to = "/feeds/"
  status = 301
  force = true

# --- Redirect .html extensions to clean URLs for all directories ---
# These use force=true to override Netlify's default file serving
[[redirects]]
  from = "/breeds/birds/*.html"
  to = "/breeds/birds/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/breeds/cats/*.html"
  to = "/breeds/cats/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/breeds/dogs/*.html"
  to = "/breeds/dogs/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/breeds/fish/*.html"
  to = "/breeds/fish/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/breeds/reptiles/*.html"
  to = "/breeds/reptiles/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/breeds/small-animals/*.html"
  to = "/breeds/small-animals/:splat"
  status = 301
  force = true

# --- New categories: Amphibians and Marine Fish ---
[[redirects]]
  from = "/breeds/amphibians/*.html"
  to = "/breeds/amphibians/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/breeds/marine-fish/*.html"
  to = "/breeds/marine-fish/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/breeds/*.html"
  to = "/breeds/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/guides/*.html"
  to = "/guides/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/locations/*.html"
  to = "/locations/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/tools/*.html"
  to = "/tools/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*.html"
  to = "/resources/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/embed/*.html"
  to = "/embed/:splat"
  status = 301
  force = true

# Catch-all for root-level .html pages
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# =====================================================
# HEADERS — SEO and performance optimization
# =====================================================

# Default headers for all pages — security + SEO
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# No-index for embed resources (loaded in iframes)
[[headers]]
  for = "/embed/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# No-index for RSS feed landing pages and feed files
[[headers]]
  for = "/feeds/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# No-index for the styles helper page
[[headers]]
  for = "/styles.css.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Cache static assets aggressively
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# XML feeds cache for 1 hour
[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
