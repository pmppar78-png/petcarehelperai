# --- Commercial pages: .html extension → clean URLs ---
[[redirects]]
  from = "/commercial/dogs/*.html"
  to = "/commercial/dogs/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/commercial/cats/*.html"
  to = "/commercial/cats/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/commercial/birds/*.html"
  to = "/commercial/birds/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/commercial/fish/*.html"
  to = "/commercial/fish/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/commercial/marine-fish/*.html"
  to = "/commercial/marine-fish/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/commercial/reptiles/*.html"
  to = "/commercial/reptiles/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/commercial/amphibians/*.html"
  to = "/commercial/amphibians/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/commercial/small-animals/*.html"
  to = "/commercial/small-animals/:splat"
  status = 301
  force = true

# Catch-all for root-level .html pages
[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# =====================================================
# HEADERS — SEO and performance optimization
# =====================================================

# Default headers for all pages — security + SEO
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# No-index for embed resources (loaded in iframes)
[[headers]]
  for = "/embed/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# No-index for RSS feed landing pages and feed files
[[headers]]
  for = "/feeds/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# No-index for the styles helper page
[[headers]]
  for = "/styles.css.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Cache static assets aggressively
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# XML feeds cache for 1 hour
[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
