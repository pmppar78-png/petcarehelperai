[build]
  publish = "."
  functions = "netlify/functions"

# pretty_urls is intentionally DISABLED so that .html redirect rules (force=true)
# work correctly. Netlify default file serving already handles clean URLs natively:
# /about serves about.html, /breeds/cats/persian serves breeds/cats/persian.html.
# With pretty_urls enabled, .html requests bypass redirect rules and serve 200
# (creating duplicate indexable URLs that cause GSC "Page with redirect" issues).

# =====================================================
# REDIRECT RULES — Single-hop 301s to canonical URLs
# Canonical format: https://petcarehelperai.com/path (no trailing slash, no .html)
# Directory indexes use trailing slash: /tools/, /locations/, /feeds/
# =====================================================

# --- Domain normalization (www → non-www) ---
# Netlify handles http→https automatically at the edge.
# www→non-www is configured via Netlify domain settings.
# These rules provide a fallback for any edge cases.

[[redirects]]
  from = "https://www.petcarehelperai.com/*"
  to = "https://petcarehelperai.com/:splat"
  status = 301
  force = true

# --- Intentional alias redirect ---
[[redirects]]
  from = "/ai"
  to = "/chat"
  status = 301
  force = true

# --- Redirect index.html files to directory paths ---
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# --- Directory index serving ---
# /tools/, /locations/, /feeds/ are handled natively by Netlify:
# - /tools serves tools/index.html (with automatic trailing-slash redirect)
# - /tools/ serves tools/index.html directly
# Explicit redirect rules for these were removed because they caused
# infinite 301 redirect loops (the force=true flag made Netlify redirect
# /tools/ back to /tools/ endlessly, producing 5xx errors for crawlers).

# --- Redirect .html extensions to clean URLs for all directories ---
# These use force=true to override Netlify's default file serving
[[redirects]]
  from = "/breeds/birds/*.html"
  to = "/breeds/birds/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/breeds/cats/*.html"
  to = "/breeds/cats/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/breeds/dogs/*.html"
  to = "/breeds/dogs/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/breeds/fish/*.html"
  to = "/breeds/fish/:splat"
  status = 301
  force = true

