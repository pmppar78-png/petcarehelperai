# HEADERS — SEO and performance optimization
# =====================================================

# --- Critical crawl files: ads.txt, robots.txt, sitemap.xml ---
# Served with correct content types, short cache, no X-Robots-Tag
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap-*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Default headers for all pages — security + SEO
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# =====================================================
# Noindex only for utility / non-content pages
# All content pages (breeds, guides, commercial, locations) are indexed.
# =====================================================

# No-index for tools pages
# No-index for chat page (interactive tool, not editorial content)
[[headers]]
  for = "/chat"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# No-index for 404 page
[[headers]]
  for = "/404"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# No-index for embed resources (loaded in iframes)
[[headers]]
  for = "/embed/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# No-index for RSS feed files (not meant for direct browsing)
[[headers]]
  for = "/feeds/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# No-index for the styles helper page
[[headers]]
  for = "/styles.css.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Cache static assets aggressively
[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# XML feeds cache for 1 hour
[[headers]]
  for = "/*.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
